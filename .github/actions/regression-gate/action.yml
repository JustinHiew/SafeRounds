name: Judge regression gate
description: >
  Fails the job when a changed prompt or model catches fewer high-severity cases than the current
  one. Compares two saved judge runs against human labels; reads files only and never calls a model.
inputs:
  baseline:
    description: JudgeResult JSONL from the current prompt/model (path in the caller's workspace)
    required: true
  candidate:
    description: JudgeResult JSONL from the proposed prompt/model
    required: true
  labels:
    description: HumanLabel JSONL, or a reviewer-feedback export from the service
    required: true
  margin:
    description: Allowed drop in high-severity recall (0.02 = two percentage points)
    default: "0.02"
  min-recall:
    description: Optional floor for the candidate's high-severity recall
    default: ""
  max-needs-review-increase:
    description: Allowed rise in the needs_review rate, as a share of conversations
    default: "0.05"
  python-version:
    description: Python version to use (3.11 or newer)
    default: "3.12"
outputs:
  result:
    description: pass, fail or error
    value: ${{ steps.gate.outputs.result }}
  report-json:
    description: Path to the machine-readable result
    value: ${{ steps.gate.outputs.report_json }}
  report-markdown:
    description: Path to the markdown summary
    value: ${{ steps.gate.outputs.report_markdown }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install safety-eval
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}/../../.."
    - name: Run the gate
      id: gate
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        LABELS: ${{ inputs.labels }}
        MARGIN: ${{ inputs.margin }}
        MIN_RECALL: ${{ inputs.min-recall }}
        MAX_NR: ${{ inputs.max-needs-review-increase }}
      run: |
        out="${RUNNER_TEMP}/regression-gate"
        mkdir -p "$out"
        args=(--baseline "$BASELINE" --candidate "$CANDIDATE" --labels "$LABELS"
              --margin "$MARGIN" --max-needs-review-increase "$MAX_NR"
              --json "$out/gate.json" --markdown "$out/gate.md")
        if [ -n "$MIN_RECALL" ]; then args+=(--min-recall "$MIN_RECALL"); fi
        set +e
        python -m safety_eval.gate "${args[@]}"
        code=$?
        set -e
        echo "report_json=$out/gate.json" >> "$GITHUB_OUTPUT"
        echo "report_markdown=$out/gate.md" >> "$GITHUB_OUTPUT"
        if [ -f "$out/gate.md" ]; then cat "$out/gate.md" >> "$GITHUB_STEP_SUMMARY"; fi
        case $code in
          0) echo "result=pass" >> "$GITHUB_OUTPUT" ;;
          1) echo "result=fail" >> "$GITHUB_OUTPUT" ;;
          *) echo "result=error" >> "$GITHUB_OUTPUT"
             echo "### Regression gate: bad input (see the log; nothing was compared)" >> "$GITHUB_STEP_SUMMARY" ;;
        esac
        exit $code
