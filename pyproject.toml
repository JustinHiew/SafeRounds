[project]
name = "safety-eval"
version = "0.1.0"
description = "SafeRounds: retrospective safety audits for patient-facing chat (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "sqlalchemy>=2.0"]
service = ["sqlalchemy>=2.0", "uvicorn>=0.29", "anthropic>=0.40", "psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"safety_eval.service" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
