<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · SafeRounds</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
:root { --ward: #eef3f1; --ink: #102320; --muted: #4f625d; --scrub: #0d5e56; --scrub-ink: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ward: #0b1513; --ink: #e3eeeb; --muted: #9db2ac; --scrub: #6cc7b8; --scrub-ink: #062420; color-scheme: dark; } }
:root[data-theme="dark"] { --ward: #0b1513; --ink: #e3eeeb; --muted: #9db2ac; --scrub: #6cc7b8; --scrub-ink: #062420; color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ward); color: var(--ink); font: 400 17px/1.6 "Atkinson Hyperlegible Next", system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
main { max-width: 520px; display: grid; gap: 16px; }
.label { font: 500 13px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 600 40px/1.1 "Source Serif 4", Georgia, serif; }
p { margin: 0; color: var(--muted); }
a.btn { justify-self: start; display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 6px; background: var(--scrub); color: var(--scrub-ink); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <p class="label">Error 404</p>
  <h1>This page isn't on the round.</h1>
  <p>The address may be mistyped, or the page may have moved.</p>
  <a class="btn" href="/">Go to saferounds.dev</a>
</main>
</body>
</html>
